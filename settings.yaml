# 共用設定：Claude 版（config.yaml）與 Codex 版（config.codex.yaml）都會載入這個檔案。
# 研究主題、期刊策略、搜尋與備援、匯出與推播都在這裡設定；兩個引擎各自的設定放在各自的 config 檔。

output_dir: library            # 論文、解析文章、每日快報都存在這裡
lookback_days: 3               # 每次往回搜尋幾天（每天跑時設 2–3 天，避免漏掉延遲上架的論文）
max_results_per_source: 50     # 每個資料庫每次最多抓幾篇
min_relevance: 3               # 相關性 1–5，低於此分數的只記錄、不下載不解析
max_analyses_per_topic: 10     # 每個主題每天最多深度解析幾篇（控制 API 花費）

# 優先期刊清單（見 journals.yaml）
journal_list: journals.yaml
tier_strategy: fallback        # fallback：Tier 1 的高相關論文不夠才搜 Tier 2、Tier 3；all：每次都搜全部 tier
tier_min_results: 5            # fallback 的門檻：累計幾篇高相關論文（≥ min_relevance）就不再往下一層
# 各層級多久搜一次（天）。沒列出的層級每天搜。搜尋時會往回補到上次搜這一層的日期，所以不會漏掉中間的論文；
# 電腦關機幾天、或 fallback 策略這幾天沒搜到某一層，下次也會自動補搜。
tier_every_days:
  3: 7                         # Tier 3（相關學科）每週搜一次，省下大量分類費用
max_lookback_days: 60          # 補搜最多往回幾天
# 由 AI 把主題的關鍵字擴充成同義詞（例如 generative AI → ChatGPT、LLM），減少因用詞不同而漏掉的論文。
# 擴充結果存在 library/.state/keywords/<folder>.json，可以直接編輯；修改 keywords 或 description 後會重新產生。
keyword_expansion: true

# 瀏覽器備援：API 無法使用（沒有金鑰、額度用完、連線失敗）時，由 AI（Claude 或 Codex）操作瀏覽器到資料庫網站搜尋。
# 需要先安裝：pip install playwright && playwright install chromium（Codex 版另需 Node.js）
# 對應關係：wos → Web of Science 網站；sciencedirect → ScienceDirect 網站；
#           crossref 查不到的期刊 → 依 publisher 到 Taylor & Francis / SAGE / Emerald / Wiley / Springer 網站
# 瀏覽器被網站判定為機器人而擋下、失敗或沒開啟時，改讀期刊 RSS（見 journals.yaml 的 rss 欄位），不會嘗試繞過阻擋。
browser:
  enabled: true
  headless: true               # 想看 AI 怎麼操作就改成 false
  effort: medium
  extra_allowed_hosts: []      # 學校 SSO 登入網域，例如 [sso.youruniversity.edu.tw]

# 匯出：每天的高相關論文都會存成 library/exports/ 下的 RIS 與 BibTeX 檔（Zotero、EndNote、Mendeley 都能匯入）。
# 想讓論文直接進 Zotero：把 enabled 改成 true、填 library_id，並設定環境變數 ZOTERO_API_KEY
#（到 https://www.zotero.org/settings/keys 建立，需勾選寫入權限；library_id 是同一頁顯示的 userID）。
zotero:
  enabled: false
  library_type: user           # user（個人）或 group（群組）
  library_id: ""
  collection: 論文追蹤         # Zotero 中的資料夾，底下依主題、分類自動建立子資料夾；解析文章會附成子筆記

# 推播：快報與每週報告產生後送出。金鑰一律放環境變數（說明見 paper_agent/notify.py 或 README）。
notify:
  on_empty: false              # 沒有新論文時也推播
  email:
    enabled: false
    to: []                     # 收件人，例如 [you@example.com]；另需 SMTP_HOST／SMTP_USER／SMTP_PASSWORD
  line:
    enabled: false             # LINE Messaging API；需 LINE_CHANNEL_TOKEN、LINE_USER_ID
  webhook:
    enabled: false             # 需 NOTIFY_WEBHOOK_URL
    kind: slack                # slack（也適用 Google Chat、Mattermost）或 discord
  notion:
    enabled: false             # 需 NOTION_TOKEN，並把 integration 加入資料庫的連線
    database_id: ""
    title_property: Name       # 資料庫的標題欄位名稱（中文介面預設可能是「名稱」）

# 每週綜合報告：整理一週的高相關論文，歸納研究趨勢、方法、研究缺口與可行的研究問題。
# 也可以隨時手動產生：python -m paper_agent --weekly
weekly:
  enabled: true
  weekday: monday              # 每週哪一天產生（該天的執行結束後）

topics:
  - name: 生成式 AI 在觀光餐旅業的應用
    folder: genai_hospitality  # library/ 底下的資料夾名稱（建議英文）
    description: >
      研究 ChatGPT 等大型語言模型如何影響旅客決策、服務接觸與餐旅業營運，
      特別關注消費者信任與採用意願。
    keywords:
      - generative AI tourism
      - ChatGPT hospitality
      - large language model travel
      - AI chatbot hotel
    # 是否以 journals.yaml 的期刊清單為搜尋範圍（false = 不限期刊，搜尋所有論文）
    use_journal_list: true
    # tiers: [1, 2]            # 只搜指定的 tier（預設全部，依 tier_strategy 逐層）
    open_search: false         # true = 期刊清單搜完後，再做一次不限期刊的搜尋
    # 順序 = 優先順序：第一個是主要來源，書目資料以它為準；後面的來源補充摘要、PDF 與漏掉的論文
    # 可用：wos（Web of Science）、sciencedirect（Elsevier 官方 API）、crossref（各出版社登錄的資料）、
    #       openalex、semantic_scholar、arxiv（arXiv 只在不限期刊時使用）
    sources: [wos, sciencedirect, crossref, openalex, semantic_scholar]
    # Web of Science 檢索設定（選填）
    wos_db: WOS                  # WOS = 核心合集；WOK = 所有資料庫
    # wos_filter 會以 AND 接在自動產生的檢索式後面，例如只看特定期刊（SO=期刊名稱）：
    # wos_filter: SO=("TOURISM MANAGEMENT" OR "INTERNATIONAL JOURNAL OF HOSPITALITY MANAGEMENT" OR "ANNALS OF TOURISM RESEARCH")
    # 或用 wos_query 寫完整的 WoS 進階檢索式（設定後會忽略 keywords 與 wos_filter）：
    # wos_query: TS=("generative AI" OR ChatGPT) AND SO=("TOURISM MANAGEMENT" OR "ANNALS OF TOURISM RESEARCH") AND PY=(2025-2026)
    min_relevance: 3
    # 分類 = 子資料夾。key 是資料夾名，value 是給 AI 看的分類說明
    categories:
      consumer_behavior: 旅客/消費者對 AI 的態度、信任、採用意願、決策行為
      service_operations: 飯店、餐廳、旅行社導入 AI 的營運、服務流程、員工影響
      marketing_content: AI 生成的行銷內容、評論、目的地形象
      methods_review: 文獻回顧、研究方法、量表發展
