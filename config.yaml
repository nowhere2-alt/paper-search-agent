# Claude 版設定：python -m paper_agent（預設讀這個檔案）
# 共用設定（主題、期刊、搜尋、匯出、推播）在 settings.yaml。
include: settings.yaml

engine: claude
claude:
  model: claude-opus-5-5       # 深度解析與每日總覽用的模型
  # 分類只看標題與摘要，用 Haiku 5.5 費用約為 Opus 5.5 的 1/40。想讓分類也用 Opus，把這行刪掉即可。
  classify_model: claude-haiku-5-5
  language: 繁體中文
  analysis_effort: high        # low / medium / high / xhigh / max；越高越深入也越貴
  # 分類與解析改用 Message Batches API：費用為一般呼叫的一半，品質相同，但要等批次跑完（通常幾分鐘）。
  # 超過 batch_timeout_min 沒跑完會取消批次，剩下的改用一般呼叫，不會讓排程卡住。想即時看結果就改成 false。
  use_batch: true
  batch_timeout_min: 60        # 最壞情況：每層分類＋解析各一批，60 分鐘×4 仍在 GitHub Actions 的 6 小時上限內

browser:
  profile_dir: ~/.paper-agent/browser-profile   # 專用瀏覽器設定檔，只在這裡登入要搜尋的資料庫
  max_steps: 40                # 每個網站最多操作幾輪（每輪約一次 Claude 呼叫），控制花費
